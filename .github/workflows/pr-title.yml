name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce conventional-commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|perf|build|ci)(\([a-z0-9_-]+\))?!?: .+'
          if ! echo "$TITLE" | grep -qE "$pattern"; then
            echo "PR title must match: type(scope)?: description"
            echo "  types: feat fix docs chore refactor test perf build ci"
            echo "  add '!' after the type/scope for a breaking change, e.g. 'feat!: ...'"
            echo "  got: $TITLE"
            exit 1
          fi
