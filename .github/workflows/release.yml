name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cut release
        id: release
        run: |
          version=$(python3 scripts/release.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "tunnels-release-bot"
          git config user.email "actions@github.com"
          git add pyproject.toml CHANGELOG.md
          git commit -m "chore(release): v${{ steps.release.outputs.version }}"
          git tag "v${{ steps.release.outputs.version }}"
          git push origin main
          git push origin "v${{ steps.release.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create "v${{ steps.release.outputs.version }}" \
            --title "v${{ steps.release.outputs.version }}" \
            --notes-file .release-notes.md
