[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tunnels-cli"
version = "0.8.2"
description = "Open AWS SSM port forward tunnels to private EKS clusters and databases through a jump host, patch kubeconfig, and float an on-screen label of the account and cluster in use."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "zivgl66" }]
keywords = ["aws", "ssm", "eks", "kubernetes", "tunnel", "bastion", "sso"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]
dependencies = [
  "PyYAML>=6.0",
  "pyobjc-framework-Cocoa>=9.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tunnels = "tunnels_cli.cli:app"

[project.urls]
Homepage = "https://github.com/Zivgl66/tunnels"
Issues = "https://github.com/Zivgl66/tunnels/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tunnels_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
